طازج والفاكهة الطبيعية، وتتوجها وصفتنا الأيقونية «كريمة بيومي المميزة» منذ اليوم الأول. وفي الشتاء كانت تُضاف لقائمة المنتجات البليلة والبسيمة والهريسة لتكتمل البهجة.","era3Title":"أول محل ثابت في بوالينو باشا","era3Text":"مع اتساع شهرة العربة المتجولة، افتتح الشيخ إبراهيم أول محل ثابت لبيع الجيلاتي والعصائر الطبيعية في شارع بوالينو باشا بمحرم بك، في خطوة توسعية مهمة للقاء زبائننا في مكان ثابت.","era4Title":"الانتقال إلى شارع زين العابدين","era4Text":"نقل النشاط وتوحيده بالكامل في المحل الجديد عند تقاطع شارع زين العابدين مع شارع منصور باشا بمحرم بك (نصر أحمد زكي حالياً)، بصالة عرض أمامية للزبائن ومعمل تصنيع خلفي، مع استمرار تقديم الجيلاتي والمنيو الشتوي الدافئ طوال العام.","era5Title":"عصر التخصص والتركيز على الجودة","era5Text":"التوقف عن تقديم المنيو الشتوي الذي استمر منذ أيام العربة المتجولة، واتخاذ قرار التخصص الكامل في الجيلاتي طوال العام، والتركيز على صقل جودة وصفتنا وتقديمها بأفضل شكل.","era6Title":"انتقال الأمانة وصون الإرث","era6Text":"رحيل المؤسس الشيخ إبراهيم بيومي بعد مسيرة كفاح ملهمة، وتولي الأبناء قيادة الكيان مُعاهِدين على الحفاظ على أسرار الصنعة ونقاء المنتج الطبيعي دون أي تغيير في الوصفة التاريخية.","era7Title":"مشاركتكم أسعد اللحظات","era7Text":"ابتكار وتقديم \"تورتات الجيلاتي\" للمناسبات العائلية والأفراح السكندرية، لتتحول خلطاتنا الطبيعية إلى شريك أساسي في احتفالاتكم وصناعة ذكرياتكم السعيدة.","era8Title":"ثبات المذاق عبر الزمن","era8Text":"اليوم، يظل فرع زين العابدين بمحرم بك هو قلب حكايتنا النابض وحارس ذكرياتنا المشتركة. لقد اخترنا أن نحافظ على أصالة مكاننا الأول وصون جودة وصفتنا التاريخية لكي نقدم لكم جيلاتي طبيعياً بنفس المذاق والروح، ليبقى محلنا دائماً وجهة دافئة تجمع الأجيال.","creamBadge":"مذاق محفوظ عبر الأجيال","creamTitle":"كريمة بيومي المميزة","creamText":"منذ اليوم الأول عام 1925، ولدت وصفتنا الأيقونية «كريمة بيومي المميزة». ليست مجرد إضافة عادية، وإنما تُقطع وتوضع كـ “شريحة” تتوج رأس كأس أو كوب الجيلاتي، لتمنحه ذلك المذاق الذي يعرفه زبائن بيومي من أول ملعقة. تطورت أدوات العمل عبر السنين، لكن بقيت الكريمة جزءاً من الذاكرة التي يرجع لها الناس: قوامها، لونها، وطريقتها فوق الجيلاتي."},"reviews":{"googleReviewsLink":"تصفح أكثر من 250 تقييم على خرائط جوجل","googleMaps":"خرائط جوجل","items":[{"name":"ماجد أحمد الشريف","rating":"5","text":"آتي له مشياً على الأقدام من بعيد لاسترجاع ذكرياتي في محرم بك وتذوق الجيلاتي الجميل من بيومي.. ما يزيد عن نصف قرن وأنا طفل مع جدي ولم أنسَ تلك الأيام الجميلة.","avatarUrl":"https:\u002F\u002Flh3.googleusercontent.com\u002Fa-\u002FALV-UjVQxynm44TJj2PscjruGMyNCjynHl1HxoSmXOC4W7WMSJbqmrM=s64-c-rp-mo-br100","reviewUrl":"https:\u002F\u002Fwww.google.com\u002Fmaps\u002Freviews\u002Fdata=!4m8!14m7!1m6!2m5!1sCi9DQUlRQUNvZENodHljRjlvT2s1TFYyVm5ZVnBoZFY5RGFUQlBkazl3YjAxQ1NYYxAB!2m1!1s0x0:0xe567511749303ce!3m1!1s2@1:CAIQACodChtycF9oOk5LV2VnYVphdV9DaTBPdk9wb01CSXc%7C%7C?hl=en-US"},{"name":"خالد","rating":"5","text":"أحلى آيس كريم في مصر لأنه طبيعي، وطبقة الكريمة اللي تقريباً مفيش محل بيعملها في العالم كله، حقيقي تجربة لا تُنسى.","avatarUrl":"https:\u002F\u002Flh3.googleusercontent.com\u002Fa\u002FACg8ocKh-Dp20HU_4L-qPXL2nQDE1DmsbUBp2CN5n0-iRqTMHH-6oQ=s64-c-rp-mo-br100","reviewUrl":"https:\u002F\u002Fwww.google.com\u002Fmaps\u002Freviews\u002Fdata=!4m8!14m7!1m6!2m5!1sChdDSUhNMG9nS0VJQ0FnSUNyNmNteXhnRRAB!2m1!1s0x0:0xe567511749303ce!3m1!1s2@1:CIHM0ogKEICAgICr6cmyxgE%7C%7C?hl=en-US"},{"name":"زياد شاهين","rating":"5","text":"عنده أي جيلاتي بيحط عليه قشطة وكريمة رهيبة، وكل الأطعمة عنده طبيعية وبأعلى جودة وخصوصاً المستكة والليمون.","avatarUrl":"https:\u002F\u002Flh3.googleusercontent.com\u002Fa-\u002FALV-UjUTyNyPgQvjTlSw-ZOBFisslwGdlPverSdXRZhuxf6NwjCg4cA=s64-c-rp-mo-br100","reviewUrl":"https:\u002F\u002Fwww.google.com\u002Fmaps\u002Freviews\u002Fdata=!4m8!14m7!1m6!2m5!1sChZDSUhNMG9nS0VJQ0FnSURKa3QyU0tBEAE!2m1!1s0x0:0xe567511749303ce!3m1!1s2@1:CIHM0ogKEICAgIDJkt2SKA%7C%7C?hl=en-US"},{"name":"رامي صالح","rating":"5","text":"أقدم محل جيلاتي في محرم بك والأعرق في الإسكندرية.. أهم ما يميزه إضافة الكريمة اللباني الفاخرة على الجيلاتي واستخدام أجود الألبان الطبيعية وتورتات جيلاتي ممتازة.","avat
